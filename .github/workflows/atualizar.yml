# Mantém o site atualizado sozinho no GitHub Pages.
#   - a cada 15 minutos: calendário automático (tabelas e placares do sistema oficial) e placar ao vivo
#   - uma vez por dia: campeonatos recém-encerrados da World Curling, fichas novas e exportação completa
# O banco (data/hello_curling.sqlite) fica anexado à release "banco" do GitHub: é baixado no começo,
# e na parte diária é substituído pela versão nova. Assim o repositório não cresce a cada atualização.
# Só faz commit e publica quando algum dado mudou de verdade, ou quando o próprio site muda (push em site/).
# O agendamento do GitHub atrasa muito (às vezes horas); quem chama o robô na hora certa é o nosso serviço na
# Cloudflare (worker/api.js), com "agendado" ligado. O agendamento abaixo fica só de reserva.
name: Atualizar dados

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 6 * * *"
  push:
    branches: [main]
    paths: ["site/**", "hc/site_build.py"]
  workflow_dispatch:
    inputs:
      completo:
        description: "Rodar também a parte diária (campeonatos, fichas e exportação)"
        type: boolean
        default: false
      agendado:
        description: "Chamado pelo agendamento da Cloudflare (só publica se algum dado mudou)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests
      - name: Baixar o banco
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download banco --pattern hello_curling.sqlite --dir data
      - name: Calendário automático (torneios atuais e próximos)
        run: python -m hc sync-schedule || echo "calendário falhou, fica a versão anterior"
      - name: Placar ao vivo
        run: python -m hc sync-live
      - name: Campeonatos novos, fichas e exportação (diário)
        id: diario
        if: github.event.schedule == '30 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.completo)
        run: |
          python -m hc sync-wcf --since 2026
          python -m hc persons --limit 600   # fichas que faltam, das mais recentes para as antigas
          python -m hc persons --since 2025-26
          python -m hc dupes
          python -m hc overrides
          python -m hc photos || echo "fotos: falhou, fica para amanhã"
          python -m hc export
      - name: Guardar mudanças
        id: commit
        run: |
          git config user.name "hello-curling-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/img/people
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualiza dados $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Guardar o banco (diário)
        if: steps.diario.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload banco data/hello_curling.sqlite --clobber
      - name: Montar site
        if: steps.commit.outputs.mudou == 'true' || (github.event_name != 'schedule' && !inputs.agendado)
        run: python -m hc build-site
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.mudou == 'true' || (github.event_name != 'schedule' && !inputs.agendado)
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.mudou == 'true' || (github.event_name != 'schedule' && !inputs.agendado)
